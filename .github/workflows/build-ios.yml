name: Build iOS IPA
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build archive
        run: |
          xcodebuild archive \
            -scheme DoroCarApp \
            -archivePath DoroCarApp.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath DoroCarApp.xcarchive \
            -exportPath ./output \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DoroCarIPA
          path: output/*.ipa
