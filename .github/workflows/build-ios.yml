name: Build iOS IPA SPM
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 生成SwiftPackage manifest Package.swift
        run: |
          cat > Package.swift <<'EOF'
// swift-tools-version:5.9
import PackageDescription

let package = Package(
    name: "DoroCarIOS",
    platforms: [
        .iOS(.v16)
    ],
    products: [
        .executable(name: "DoroCarIOS", targets: ["DoroCarIOS"])
    ],
    targets: [
        .executableTarget(
            name: "DoroCarIOS",
            sources: ["DoroCarApp.swift"],
            resources: [.copy("UI")]
        )
    ]
)
EOF

      - name: Build release
        run: |
          swift build --target DoroCarIOS -c release --arch arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoroCar-build
          path: .build/release/DoroCarIOS
