name: Build iOS IPA
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: 列出项目全部Scheme
        run: |
          ls -la
          # 自动识别是xcworkspace还是xcodeproj
          if [ -f *.xcworkspace ];then
            echo "找到 xcworkspace"
            xcodebuild -list -workspace *.xcworkspace
          else
            echo "找到 xcodeproj"
            xcodebuild -list -project *.xcodeproj
          fi
