name: Build iOS
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Build Release
        run: swift build -c release --arch arm64

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: DoroCarBinary
          path: .build/release/DoroCarIOS
